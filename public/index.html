function setsHTML(){return`<label>Sensibilidade<input type="range" data-k="sens" min=".3" max="3" step=".1" value="${CFG.sens}"></label><label>Campo de visão<input type="range" data-k="fov" min="65" max="105" step="1" value="${CFG.fov}"></label><label>Volume<input type="range" data-k="vol" min="0" max="1" step=".05" value="${CFG.vol}"></label><label>Qualidade<select data-k="q"><option value="0">Baixa</option><option value="1">Média</option><option value="2">Alta</option></select></label><label>Dificuldade<select data-k="diff"><option value="0">Fácil</option><option value="1">Normal</option><option value="2">Difícil</option></select></label><label>Inverter eixo Y<select data-k="inv"><option value="0">Não</option><option value="1">Sim</option></select></label><label>Mira: tamanho<input type="range" data-k="xs" min="10" max="40" step="1" value="${CFG.xs||18}"></label><label>Mira: opacidade<input type="range" data-k="xo" min=".2" max="1" step=".05" value="${CFG.xo||.6}"></label><label>Mira: cor<select data-k="xc"><option value="0">Branca</option><option value="1">Vermelha</option><option value="2">Ciano</option></select></label><label>Mira<select data-k="xv"><option value="0">Visível</option><option value="1">Oculta</option></select></label><label>Pós-processamento (bloom)<select data-k="fx"><option value="0">Ligado</option><option value="1">Desligado</option></select></label><label>Iniciar na onda<select data-k='sw'>${Array.from({length:NW},(_,i)=>`<option value='${i}'>${i+1}${(i+1)%6==0?' — CHEFE':''}</option>`).join('')}</select></label><div style='margin-top:8px;opacity:.8'>Controles: clique e pressione a tecla</div>${KBROWS()}<button class='bt' data-a='kbreset'>RESTAURAR CONTROLES</button>`}
function menu(title,paused){pvOff();LASTM=[title,paused];$('ov').innerHTML=`<div><h1>${title||'NÚCLEO ABISSAL'}</h1>${paused?'':`<p style="opacity:.75">Atravesse 30 ondas, com chefes nas ondas 6, 12, 18, 24 e 30.<br>Melhor onda: ${SAVE.best}/30 · Vitórias: ${SAVE.wins} · Abates: ${SAVE.kills}</p>`}<button class="bt" data-a="${paused?'resume':'play'}">${paused?'CONTINUAR':'JOGAR'}</button>${paused?'':'<button class="bt" data-a="mp">MULTIPLAYER</button>'}<button class="bt" data-a="look">PERSONAGEM</button><button class="bt" data-a="hudedit">PERSONALIZAR CONTROLES MOBILE</button>${paused?'<button class="bt" data-a="play" '+(NET.on?'style="display:none"':'')+'>REINICIAR</button><button class="bt" data-a="menu">MENU</button>':'<button class="bt" data-a="wipe">APAGAR PROGRESSO</button>'}${setsHTML()}<p style="font-size:12px;opacity:.6">${touch?'Esquerda: mover · Direita: mirar · Botões na tela':'WASD mover · Mouse mirar/atirar · Espaço pular (2x) · C impulso · R recarregar · F soco/execução · Q granada · 1-4 armas · Shift correr · Esc pausa'}</p></div>`;$('ov').style.display='flex';$('hud').style.display=paused?'block':'none';
 for(const s of $('ov').querySelectorAll('select'))s.value=CFG[s.dataset.k]||0}
$('ov').addEventListener('click',e=>{const kb=e.target.dataset.kb;if(kb){LISTEN=kb;menu(...LASTM);return}const a=e.target.dataset.a;if(!a)return;if(a==='kbreset'){Object.assign(KB,KD);LS.set('abyss_keys',KB);menu(...LASTM);return}if(/^(mp|look|hud|he)/.test(a)){mpAct(a);return}initA();if(a==='play')newGame(0);else if(a==='retry')newGame(1);else if(a==='resume'){if(NET.on)NET.pm=0;S='play';$('ov').style.display='none';if(!touch)R.domElement.requestPointerLock()}else if(a==='menu'){if(NET.on)netLeave(false);S='menu';menu()}else if(a==='wipe'&&confirm('Apagar todo o progresso?')){Object.assign(SAVE,{best:0,wins:0,kills:0,deaths:0});LS.set('abyss_save',SAVE);menu()}});
$('ov').addEventListener('input',e=>{const c=e.target.dataset.c;if(c){setLook(c,e.target.value);return}const k=e.target.dataset.k;if(!k)return;CFG[k]=+e.target.value;LS.set('abyss_cfg',CFG);resize()});
let tt=0;function toast(t){const e=$('ts');e.textContent=t;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,1800)}
// ===== Atualização =====
function updPlayer(dt){const m=moveVec(),sp=(K[KB.run]||TS.run)?11:7.5;
 if(P.dashT>0){P.dashT-=dt;burst(new V3(P.p.x,P.p.y+1,P.p.z),3,0x88ddff,1,.05,.35,0);P.v.x=P.dd.x*34;P.v.z=P.dd.z*34;P.v.y=0}else{const f=1-Math.exp(-(P.ground?16:3.5)*dt);P.v.x+=(m.x*sp-P.v.x)*f;P.v.z+=(m.z*sp-P.v.z)*f;P.v.y-=26*dt}
 if(jp){jp=0;if(P.ground){P.v.y=9.5;P.jumps=1;snd('jump')}else if(P.jumps<2){P.v.y=9;P.jumps=2;snd('jump');burst(P.p,22,0x88aaff,5,.08,.45,2);ring(P.p,2.4,0x88aaff,.3)}}
 const vy=P.v.y;move(P,P.v.x*dt,P.v.y*dt,P.v.z*dt);if(P.ground){if(!P.was&&vy<-9){P.land=.18;shake(.25);snd('land')}P.jumps=0}P.was=P.ground;
 if(P.ground)P.bob+=Math.hypot(P.v.x,P.v.z)*dt*.9;if(P.dash<2){P.dashR+=dt;if(P.dashR>=2.6){P.dash++;P.dashR=0}}
 P.fireCd-=dt;P.inv-=dt;P.melee-=dt;P.land-=dt;if(P.gren>0)P.gren-=dt;P.kick=Math.max(0,P.kick-dt*6);
 if(P.swap>0){P.swap-=dt;if(P.swap<.13&&P.pend>=0){P.w=P.pend;P.pend=-1;VM.forEach((g,i)=>g.visible=i===P.w);P.sawS=P.w===4?1:0;P.sawT=0;P.rev=0;P.spin=0;P.mAcc=0;if(P.w===4)snd('saw_start')}}
 if(P.reload>0){P.reload-=dt;if(P.reload<=0){const i=P.w,n=Math.min(WD[i].mag-P.mag[i],P.res[i]);P.mag[i]+=n;P.res[i]-=n}}
 if(P.w===4)updSaw(dt);else if(P.w===5)updMini(dt);else if(trig&&(WD[P.w].auto||!prevT))fire();prevT=trig;
 for(const l of LAVA)if(P.p.x>l.x0&&P.p.x<l.x1&&P.p.z>l.z0&&P.p.z<l.z1&&P.p.y<.35){P.hp-=10*dt;stats.taken+=10*dt;shake(.02);if(P.hp<=0)die()}
 for(let i=PK.length-1;i>=0;i--){const k=PK[i];k.m.rotation.y+=dt*2;k.m.position.y=.6+Math.sin(TM*3+i)*.1;if(Math.hypot(k.m.position.x-P.p.x,k.m.position.z-P.p.z)<1.7&&Math.abs(P.p.y+.8-k.m.position.y)<2){
  if(NET.on&&!NET.host){if(!k.req){k.req=1;netSend({t:'take',id:k.id});setTimeout(()=>{k.req=0},800)}continue}let ok=1;if(k.t==='hp'){if(P.hp>=100)ok=0;else P.hp=Math.min(100,P.hp+30)}else if(k.t==='ar'){if(P.ar>=100)ok=0;else P.ar=Math.min(100,P.ar+30)}else{WD.forEach((w,j)=>P.res[j]=Math.min(w.mx,P.res[j]+Math.ceil(w.mx*.3)))}
  if(ok){if(NET.on)netSend({t:'pdel',id:k.id});scene.remove(k.m);PK.splice(i,1);snd('pick');toast(k.t==='hp'?'+SAÚDE':k.t==='ar'?'+ARMADURA':'+MUNIÇÃO')}}}}
function updCam(dt){const sp=Math.hypot(P.v.x,P.v.z),bb=P.ground?Math.sin(P.bob*1.8)*.045*Math.min(1,sp/7):0;shk*=Math.pow(.02,dt);const s=CFG.shake===0?0:shk*.03;
 cam.position.set(P.p.x+rnd(-s,s),P.p.y+1.62+bb-Math.max(0,P.land)*.6+rnd(-s,s),P.p.z+rnd(-s,s));cam.rotation.set(P.pitch+rnd(-s,s),P.yaw+rnd(-s,s),-(K[KB.right]?1:0)*.02+(K[KB.left]?1:0)*.02+rnd(-s,s));
 const tf=(CFG.fov+(P.dashT>0?14:sp>9?5:0))*(adsOn()?.72:1);cam.fov+=(tf-cam.fov)*Math.min(1,dt*8);cam.updateProjectionMatrix();
 const g=wg,sw=Math.min(1,sp/8),sd=P.swap>0?Math.sin(Math.PI*(1-P.swap/.26)):0,rl=0,run=sp>9?1:0;
 g.position.set(.28+Math.sin(P.bob*.9)*.015*sw,-.26+Math.abs(Math.sin(P.bob*1.8))*.012*sw-sd*.35-rl*.12-run*.04-P.v.y*.002,-.55+P.kick*.1);g.rotation.set(P.kick*.15-rl*.7+(P.melee>0?-.5*Math.sin(P.melee*6):0),run*.25,rl*.2);
 const w=VM[P.w];if(w.pump)w.pump.position.z=-.3+(P.fireCd>0&&P.w===1?Math.sin(clamp(1-P.fireCd/.8,0,1)*Math.PI)*.12:0);rlAnim(dt,w);muz.position.copy(w.muz)}
function hud(){const w=WD[P.w];xhUpd();const sv=Math.hypot(P.v.x,P.v.z);$('spd').style.opacity=P.dashT>0?.9:Math.min(.5,Math.max(0,sv-9)/8);$('hp').textContent=Math.max(0,Math.ceil(P.hp));$('ar').textContent=Math.ceil(P.ar);$('bhp').style.width=clamp(P.hp,0,100)+'%';$('bar').style.width=P.ar+'%';
 $('wn').textContent=w.n+(P.reload>0?' — RECARREGANDO':'');$('am').textContent=P.w===4?'∞':P.mag[P.w];$('rs').textContent=P.w===4?'':'/ '+P.res[P.w];$('ds').textContent='◆'.repeat(P.dash)+'◇'.repeat(2-P.dash);$('gr').textContent=P.gren>0?P.gren.toFixed(1)+'s':'PRONTA';
 $('obj').innerHTML=`${ENVN[EV(wave)]} · ONDA ${String(wave+1).padStart(2,'0')}/${NW}<br>${phase==='prep'?'ENTRE NA ARENA':phase==='fight'?'AMEAÇAS: '+(alive()+(NET.on&&!NET.host?NET.qn:queue.length))+' · SAÍDA BLOQUEADA':'ÁREA SEGURA — SAÍDA LIBERADA'} · ${stats.score} pts`;
 const b=EN.find(e=>e.boss&&!e.dead);$('boss').style.display=b?'block':'none';if(b)$('boss').firstElementChild.textContent=BN[b.type]||'CHEFE';if(b)$('bb').style.width=clamp(b.hp/b.max*100,0,100)+'%';$('cb').textContent=combo>1?'COMBO x'+Math.min(combo,8):'';$('gl').style.display=nearVuln()?'block':'none'}
function menuCam(dt){const a=TM*.12;cam.position.set(Math.sin(a)*25,9,Math.cos(a)*25);cam.lookAt(0,3,0);wg.visible=false}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;TM+=dt;crystal.rotation.y+=dt;crystal.rotation.x+=dt*.5;scene.fog.color.lerp(FT,Math.min(1,dt*1.5));scene.background.copy(scene.fog.color).multiplyScalar(.5);updDoors(dt);engUpd(dt);netTick(dt);lavaTex.offset.y-=dt*.05;
 if(S==='play'||S==='cdead'){ts+=(1-ts)*Math.min(1,dt*4);const g=dt*ts;clock0+=g;wg.visible=S==='play';if(S==='cdead'){}else if(GK)updGK(g);else updPlayer(g);if(S==='play'||S==='cdead'){for(const e of EN){if(e.ghost)updGhost(e,g);else netUpdE(e,g)}if(Math.floor(TM)%2===0)EN=EN.filter(e=>!e.rm);updProj(g);if(!NET.on||NET.host)updWave(g);comboT-=g;if(comboT<=0)combo=0;if(S==='cdead')specCam(g);else updCam(g);rpUpdate(g);hud();updFx(g)}}
 else{if(S!=='pause')menuCam(dt);if(S==='pause')wg.visible=true;updFx(S==='pause'?0:dt)}
 if(comp&&CFG.fx!==1&&CFG.q>0){fxP.uniforms.amt.value=Math.max(P.dashT>0?.09:0,fxA);fxA*=.92;comp.render()}else R.render(scene,cam)}
resetP();menu();requestAnimationFrame(loop);
</script></body></html>
